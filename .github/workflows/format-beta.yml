name: Format public beta branch
on:
  push:
    branches: [feat/public-beta-safety]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-beta-safety
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/front.mjs server/lib/publicBeta.mjs server/routes/ask.mjs test/public-beta.test.mjs api/relay.mjs
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/front.mjs server/lib/publicBeta.mjs server/routes/ask.mjs test/public-beta.test.mjs api/relay.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format public beta implementation'
            git push origin HEAD:feat/public-beta-safety
          fi
